spring:
  application:
    name: northstar-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/northstar}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
